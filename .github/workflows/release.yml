name: Release

on:
  push:
    tags: ["claude-v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build web UI
        working-directory: web
        run: bun install --frozen-lockfile && bun run build

      - name: Package release artifacts
        run: |
          set -euo pipefail
          NAME="${GITHUB_REF_NAME#claude-v}"
          STAGE="aiman-claude-$NAME"
          mkdir -p "$STAGE"
          cp -r bin server dist package.json README.md FORK.md LICENSE CHANGELOG.md .env.example "$STAGE"/
          tar -czf "aiman-claude-$NAME.tar.gz" "$STAGE"
          (cd "$STAGE" && zip -qr "../aiman-claude-$NAME.zip" .)
          sha256sum "aiman-claude-$NAME.tar.gz" "aiman-claude-$NAME.zip" > SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          NAME="${GITHUB_REF_NAME#claude-v}"
          awk -v v="$NAME" '
            /^## \[/ { if (on) exit; on = index($0, "[aiman-claude " v "]") > 0; next }
            on { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG.md section for aiman-claude $NAME" >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: aiman-claude ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            aiman-claude-*.tar.gz
            aiman-claude-*.zip
            SHA256SUMS.txt
